[project]
name = "cypher-native-host"
version = "0.2.0"
description = "On-demand Cypher YouTube native messaging connector"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<1", "pydantic>=2,<3", "yt-dlp>=2026.10.21", "PyJWT[crypto]>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cypher_native"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
pythonpath = ["src", "../companion/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
